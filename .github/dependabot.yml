version: 2
updates:
  - package-ecosystem: "pip"
    directory: /
    schedule:
      interval: "weekly"
    security-updates: "auto"
    versioning-strategy: "increase"
    groups:
      python-packages:
        patterns: 
          - "*"
  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
